# Annotated example configuration for `bursa kes-agent`.
# Pass with --config or the BURSA_CONFIG environment variable.
#
# These settings are read by the KES agent daemon, not by `bursa signer`.

kes_agent:
  # Mode:
  #   serve-key  push the current KES signing key (with its opcert) to the producer.
  #   sign       sign block headers on the producer's behalf; the key never leaves.
  mode: "serve-key"                # env: KESAGENT_MODE

  # Unix sockets. service_socket is where the block producer connects;
  # control_socket handles gen-staged-key / install-key / drop-key / info.
  service_socket: "/run/bursa/kes-agent/service.sock"   # env: KESAGENT_SERVICE_SOCKET
  control_socket: "/run/bursa/kes-agent/control.sock"   # env: KESAGENT_CONTROL_SOCKET

  # Independent octal file modes - deliberately NOT a single shared setting.
  # Widening service_socket_mode to "0660" (plus adding the producer's user to
  # the agent's group) lets the block producer reach the service socket
  # without also exposing the control socket, which can drop/install keys and
  # should stay owner-only. Do not widen control_socket_mode to grant the
  # producer's group access.
  service_socket_mode: "0600"      # env: KESAGENT_SERVICE_SOCKET_MODE
  control_socket_mode: "0600"      # env: KESAGENT_CONTROL_SOCKET_MODE
  # The kes-agent daemon validates control_socket_mode at startup and refuses
  # to run if it grants group/other write access - the control socket can
  # install and drop keys, so it must stay owner-only.

  # Pool COLD VERIFICATION key. The agent only ever holds the cold vkey; the
  # cold signing key never touches the agent. Provide one of:
  cold_vkey_file: "/etc/bursa/kes-agent/cold.vkey"  # env: KESAGENT_COLD_VKEY_FILE
  # cold_vkey_hex: "0f0e0d...aabb"                  # env: KESAGENT_COLD_VKEY_HEX

  # Shelley genesis system start (RFC3339). Used to derive absolute KES
  # periods; MUST match the target network's genesis (mainnet shown below -
  # use each network's own systemStart/slotsPerKESPeriod from its shelley
  # genesis file, e.g. Preprod: 2022-06-01T00:00:00Z, same slot/evolution
  # values).
  system_start: "2017-09-23T21:44:51Z"   # env: KESAGENT_SYSTEM_START

  # First Shelley slot and its time. Required on networks whose Byron era
  # used 20-second slots (mainnet, preprod): without them slots are counted
  # from system_start at slot_length, which runs ahead of the chain there and
  # makes the agent refuse every header. Not needed on preview.
  #   mainnet: 4492800 at 2020-07-29T21:44:51Z
  #   preprod: 86400 at 2022-06-21T00:00:00Z
  shelley_start_slot: 4492800                # env: KESAGENT_SHELLEY_START_SLOT
  shelley_start_time: "2020-07-29T21:44:51Z" # env: KESAGENT_SHELLEY_START_TIME

  # Slot schedule. slot_length is wall-clock seconds per slot (default 1);
  # slots_per_kes_period is protocol-defined (129600 on mainnet and Preprod).
  slot_length: 1                   # env: KESAGENT_SLOT_LENGTH
  slots_per_kes_period: 129600     # env: KESAGENT_SLOTS_PER_KES_PERIOD

  # Max opcert evolutions (62 on mainnet and Preprod).
  max_kes_evolutions: 62           # env: KESAGENT_MAX_KES_EVOLUTIONS

  # Scheduler tick (Go duration string). Default 1m.
  evolve_interval: "1m"            # env: KESAGENT_EVOLVE_INTERVAL

  # Durable monotonic-period guard store (atomic JSON file). Prevents serving a
  # KES period below the highest already served, across restarts/clock jumps.
  guard_file: "/var/lib/bursa/kes-agent/guard.json"  # env: KESAGENT_GUARD_FILE

  # Optional shared guard store, so several agent replicas share each
  # profile's period floor and signed slot records. Default "file" uses
  # guard_file above. With "postgres", comment out guard_file above (setting
  # both is refused, here and in each profile); the DSN is read
  # from the variable dsn_env names, and a non-loopback host requires
  # sslmode=verify-full. YAML only.
  # store:
  #   type: "postgres"
  #   dsn_env: "KESAGENT_PG_DSN"

  # Several pools, on one network or several, can be served by one agent in
  # sign mode. profiles replaces the single-pool settings above
  # (cold_vkey_file/cold_vkey_hex, system_start, slots_per_kes_period,
  # guard_file), which must be removed; slot_length and max_kes_evolutions
  # must be removed or left at their defaults (1 and 62). Each profile has
  # its own keys, schedule and guard file.
  # Control commands then take the profile name. YAML only.
  # profiles:
  #   - name: "mainnet-pool"
  #     cold_vkey_file: "/etc/bursa/kes-agent/mainnet-cold.vkey"
  #     system_start: "2017-09-23T21:44:51Z"
  #     shelley_start_slot: 4492800
  #     shelley_start_time: "2020-07-29T21:44:51Z"
  #     slots_per_kes_period: 129600
  #     guard_file: "/var/lib/bursa/kes-agent/mainnet-pool.json"
  #   - name: "preprod-pool"
  #     cold_vkey_file: "/etc/bursa/kes-agent/preprod-cold.vkey"
  #     system_start: "2022-06-01T00:00:00Z"
  #     shelley_start_slot: 86400
  #     shelley_start_time: "2022-06-21T00:00:00Z"
  #     slot_length: 1               # default 1
  #     slots_per_kes_period: 129600
  #     max_kes_evolutions: 62       # default 62
  #     guard_file: "/var/lib/bursa/kes-agent/preprod-pool.json"

  # Optional remote sign service for Dingo. This is available only in sign
  # mode and always requires a client certificate issued by the configured CA.
  # attested_listen_address: ":9443"
  # attested_tls_cert_file: "/run/secrets/kes-agent/tls.crt"
  # attested_tls_key_file: "/run/secrets/kes-agent/tls.key"
  # attested_client_ca_file: "/run/secrets/kes-agent/dingo-ca.pem"

  # The provider adapter runs inside the measured workload and produces fresh,
  # binding-specific evidence over a local Unix socket.
  # attestation_provider: "nitro"  # or "confidential-space"
  # attester_address: "unix:///run/bursa/attester.sock"

# Optional Prometheus metrics endpoint on a dedicated loopback listener. Set
# port to 0 to disable it. Non-loopback addresses and addresses that carry a
# port are rejected.
metrics:
  address: "127.0.0.1"             # env: METRICS_LISTEN_ADDRESS
  port: 8082                       # env: METRICS_LISTEN_PORT

logging:
  level: "info"                    # env: LOGGING_LEVEL

    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #101214; color: #f0f0ee; font: 15px system-ui; }
    h1, a { color: #d9b56d; }
    p { color: #a7abb2; }
    .pages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 12px; }
    img { display: block; width: 100%; border: 1px solid #30343a; border-radius: 8px; }
    @media (max-width: 700px) { body { padding: 20px; } .pages { grid-template-columns: 1fr; } }
  </style>

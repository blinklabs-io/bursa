name: storage-windows

# go-test runs on Linux only and cross-builds just ./cmd/bursa, so nothing else
# executes the Windows SQLite permission code or the owner-only checks it relies
# on. Run their tests natively.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sqlite-permissions:
    name: sqlite-permissions (windows, ${{ matrix.go-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.10, 1.27.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: go test (SQLite permissions)
        run: go test -v -count=1 -run "^TestSQLite(Store(RestrictsFilesToOwnerUnderPermissiveDirectory|TightensExistingPermissiveDatabase|RejectsFilesOwnedByAnotherIdentity|ReadOnlyDSNSecuresDatabaseAndSidecars|SecuresSidecarsRecreatedForANewConnection|OpensExistingWALDatabaseWhereCreationIsDenied|RejectsDirectoryLettingOthersReplaceEntries|RejectsAncestorLettingOthersReplaceEntries|RejectsDirectoryOwnedByAnotherIdentity|RejectsReparsePointOthersCanRetarget|OpensThroughJunctionOthersCannotRetarget|RejectsDirectoryRetargetedAfterCheck)|FilesAreOwnerOnlyBeforeSQLiteOpensThem|FilePermissionsAcceptLongPaths)$" ./internal/storage/
      - name: go test (secret file permissions)
        if: ${{ !cancelled() }}
        run: go test -v -count=1 -run "^(TestWriteSecretKeyFileWindowsCreatesOwnerOnlyFile|TestLoadSecretKeyFromFileWindowsAllowsOwner|TestCheckSecurityDescriptorAcceptsTheUserSDDLAlias)$" .

name: mobile

# Builds the Bursa mobile apps. Manual (workflow_dispatch) and on tags only —
# the toolchains (Android SDK/NDK, Xcode) are heavy, so this does not run on
# every push/PR like the Go/web CI does.
on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

env:
  GOMOBILE_VERSION: v0.0.0-20260611195102-4dd8f1dbf5d2
  XCODEGEN_VERSION: 2.45.4
  XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef

jobs:
  # Android is built via the canonical Docker image (mobile/android/Dockerfile):
  # it carries the full toolchain (Go + gomobile + Android SDK/NDK + JDK + Gradle)
  # so the AAR + APK build identically here and on a developer's machine, with no
  # Android SDK installed on the runner. The build script (build-in-docker.sh)
  # runs `gomobile bind` then Gradle, and emits the artifacts to /out.
  #
  # A tag build produces the distributable pair — a signed release APK and a
  # signed AAB — and attaches them to the draft release. Any other trigger
  # produces the unsigned debug APK, which needs no signing material.
  android:
    name: android
    runs-on: ubuntu-latest
    permissions:
      # attestations + id-token are what actions/attest needs; contents:write
      # is for attaching the artifacts to the draft release.
      attestations: write
      contents: write
      id-token: write
    outputs:
      build-type: ${{ steps.variant.outputs.build-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - name: Select build variant
        id: variant
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "build-type=release" >> "$GITHUB_OUTPUT"
            version="${GITHUB_REF#refs/tags/v}"
            echo "BURSA_VERSION_NAME=${version}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

            # versionCode must increase strictly for every uploaded build,
            # and a prerelease has to sort below the release it precedes.
            # Encode the version as
            #   (major*10000 + minor*100 + patch) * 100 + rank
            # where rank orders the prereleases of one version and a final
            # release takes 99, above all of them:
            #   alpha.N -> N        (1..29)
            #   beta.N  -> 30 + N   (31..59)
            #   rc.N    -> 60 + N   (61..89)
            #   final   -> 99
            # The stage is part of the rank so -alpha.1 and -beta.1 cannot
            # collide. Anything outside this scheme is rejected rather than
            # silently given a colliding code.
            core="${version%%-*}"
            pre="${version#"${core}"}"
            # The regex bounds digit LENGTH, not just shape, so no component
            # ever reaches bash arithmetic large enough to wrap: a 20-digit
            # major would exceed 2^64 and reduce to a small number that passes
            # a numeric range check and yields a colliding versionCode.
            # Leading zeros are rejected too: semver forbids them, and bash
            # reads 08/09 as invalid octal and aborts mid-step.
            if [[ ! "${core}" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
              echo "::error::tag ${GITHUB_REF#refs/tags/} is not vMAJOR.MINOR.PATCH[-PRERELEASE]: components must have no leading zeros, major at most 4 digits, minor and patch at most 2"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${core}"
            # Semantic bound on top of the length bound above.
            # 2099.99.99 encodes to 2099999999; 2100.0.0 would exceed the
            # Android maximum, so that is the real ceiling.
            if (( major > 2099 )); then
              echo "::error::major version ${major} is out of range for the versionCode encoding (max 2099)"
              exit 1
            fi
            if [[ -z "${pre}" ]]; then
              rank=99
            else
              # The dot is required, so -alpha1 and -alpha.1 cannot both map to
              # the same rank, and N is length-bounded for the same
              # wrap-around reason as the components above.
              if [[ "${pre}" =~ ^-(alpha|beta|rc)\.([1-9][0-9]?)$ ]]; then
                stage="${BASH_REMATCH[1]}"
                number=$((10#${BASH_REMATCH[2]}))
              else
                echo "::error::prerelease '${pre#-}' is not supported; use -alpha.N, -beta.N or -rc.N with N between 1 and 29"
                exit 1
              fi
              if (( number > 29 )); then
                echo "::error::prerelease number ${number} must be between 1 and 29"
                exit 1
              fi
              case "${stage}" in
                alpha) rank=$(( number )) ;;
                beta)  rank=$(( 30 + number )) ;;
                rc)    rank=$(( 60 + number )) ;;
              esac
            fi
            code=$(( (major * 10000 + minor * 100 + patch) * 100 + rank ))
            if (( code > 2100000000 )); then
              echo "::error::versionCode ${code} exceeds the Android maximum of 2100000000"
              exit 1
            fi
            echo "BURSA_VERSION_CODE=${code}" >> "$GITHUB_ENV"
          else
            echo "build-type=debug" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0 https://github.com/docker/setup-buildx-action/releases/tag/v4.3.0
      - name: Build Android toolchain image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0 https://github.com/docker/build-push-action/releases/tag/v7.3.0
        with:
          context: .
          file: mobile/android/Dockerfile
          tags: bursa-android-build:ci
          build-args: |
            BUILDER_UID=1001
            BUILDER_GID=1001
          push: false
          load: true
      - name: Decode release keystore
        if: steps.variant.outputs.build-type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; a tag build cannot produce a signed artifact" >&2
            exit 1
          fi
          # Keep the keystore out of the mounted repo so it cannot reach an
          # artifact or the working tree.
          mkdir -p "${RUNNER_TEMP}/signing"
          chmod 700 "${RUNNER_TEMP}/signing"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing/release.jks"
          chmod 600 "${RUNNER_TEMP}/signing/release.jks"
      - name: Build AAR + debug APK (in container)
        if: steps.variant.outputs.build-type == 'debug'
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -e BURSA_BUILD_TYPE=debug \
            -v "${{ github.workspace }}":/code \
            -v "${{ github.workspace }}/out":/out \
            bursa-android-build:ci
      - name: Build AAR + signed release APK/AAB (in container)
        if: steps.variant.outputs.build-type == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -e BURSA_BUILD_TYPE=release \
            -e BURSA_VERSION_NAME \
            -e BURSA_VERSION_CODE \
            -e BURSA_KEYSTORE_PATH=/signing/release.jks \
            -e BURSA_KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD}" \
            -e BURSA_KEY_ALIAS="${KEY_ALIAS}" \
            -e BURSA_KEY_PASSWORD="${KEY_PASSWORD}" \
            -v "${{ github.workspace }}":/code \
            -v "${{ github.workspace }}/out":/out \
            -v "${RUNNER_TEMP}/signing":/signing:ro \
            bursa-android-build:ci
      - name: Name the release artifacts
        if: steps.variant.outputs.build-type == 'release'
        run: |
          set -euo pipefail
          apk=$(find out -name '*.apk' ! -name '*-unsigned.apk' | head -n1)
          aab=$(find out -name '*.aab' | head -n1)
          mv "${apk}" "out/bursa-${BURSA_VERSION_NAME}-android-arm64.apk"
          mv "${aab}" "out/bursa-${BURSA_VERSION_NAME}-android.aab"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: bursa-android-${{ steps.variant.outputs.build-type }}
          path: |
            out/*.apk
            out/*.aab
          if-no-files-found: error
      - name: Attest release artifacts
        if: steps.variant.outputs.build-type == 'release'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: |
            out/*.apk
            out/*.aab
      - name: Upload release assets
        if: steps.variant.outputs.build-type == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The publish workflow creates the draft release for the same tag
          # concurrently, so wait for it rather than racing it.
          for _ in $(seq 1 60); do
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} was not created within 10 minutes" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" \
            "out/bursa-${BURSA_VERSION_NAME}-android-arm64.apk" \
            "out/bursa-${BURSA_VERSION_NAME}-android.aab" \
            --clobber

  # Launch the built APK on an emulator and assert the embedded wallet booted.
  # The AAR is arm64-only (the 32-bit ABIs overflow in the apollo/dingo deps), so
  # this needs an arm64 runner: an arm64-v8a image on an x86_64 host would fall
  # back to full CPU emulation and time out.
  android-smoke-test:
    name: android-smoke-test
    runs-on: ubuntu-24.04-arm
    needs: [android]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0 https://github.com/actions/download-artifact/releases/tag/v7.0.0
        with:
          name: bursa-android-${{ needs.android.outputs.build-type }}
          path: out
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0 https://github.com/actions/setup-java/releases/tag/v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the launch smoke test
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2.33.0 https://github.com/ReactiveCircus/android-emulator-runner/releases/tag/v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          disable-animations: true
          script: |
            apk=$(find out -name '*.apk' ! -name '*-unsigned.apk' | head -n1)
            bash .github/scripts/android-smoke-test.sh "$apk"

  # iOS MUST be built on macOS: Xcode cannot run in a Linux container, so Docker
  # does not apply here. gomobile builds the xcframework natively, then xcodegen
  # generates the project and xcodebuild produces an (unsigned, simulator) .app.
  ios:
    name: ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
      # Build the web bundle first so the //go:embed dist target carries the
      # production SPA before gomobile compiles the binding.
      - name: Build web bundle
        run: cd ui/web && npm ci && npm run build
      - name: Embed the web bundle into the //go:embed dist target
        run: make webui-embed
      - name: Install gomobile
        run: |
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gomobile init
        run: gomobile init
      - name: Build xcframework
        run: |
          cd ui && gomobile bind \
            -target=ios \
            -o ../mobile/ios/Bursa.xcframework \
            ./mobile
      - name: Install xcodegen
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o xcodegen.zip
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d /tmp
          sudo cp -R /tmp/xcodegen/bin /usr/local/
          sudo cp -R /tmp/xcodegen/share /usr/local/
          xcodegen --version
      - name: Generate Xcode project
        run: cd mobile/ios && xcodegen generate
      - name: Build app (simulator, unsigned)
        run: |
          cd mobile/ios && xcodebuild \
            -project Bursa.xcodeproj \
            -scheme Bursa \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package .app
        run: |
          cd mobile/ios
          APP=$(find build/Build/Products -name 'Bursa.app' -type d | head -n1)
          if [ -z "$APP" ]; then
            echo "Bursa.app was not produced by xcodebuild" >&2
            exit 1
          fi
          mkdir -p ../../out
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../../out/Bursa-ios-sim.zip
      - name: Upload .app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: bursa-ios-app
          path: out/Bursa-ios-sim.zip
          if-no-files-found: error

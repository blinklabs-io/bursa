name: zz-diag-windows-cgo

on:
  push:
    branches: ['fix/windows-wallet-cgo']

permissions:
  contents: read

jobs:
  before:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version-file: go.mod

      # ---- Per-OS webview build dependencies -------------------------------
      - name: Set up MSYS2 MinGW64 for Windows amd64 CGO
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        id: msys2-amd64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 https://github.com/msys2/setup-msys2/releases/tag/v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
      - name: Diagnose gcc without PATH change
        continue-on-error: true
        shell: pwsh
        env:
          MSYS2_LOC_AMD64: ${{ steps.msys2-amd64.outputs.msys2-location }}
        run: |
          $msys2Loc = "$env:MSYS2_LOC_AMD64"
          $env:CC = "$msys2Loc\mingw64\bin\gcc.exe"
          $env:CGO_ENABLED = "1"
          "--- PATH"; $env:PATH -split ';'
          "--- where"; where.exe libz-1.dll zlib1.dll libgmp-10.dll libisl-23.dll libmpc-3.dll libmpfr-6.dll libzstd.dll libgcc_s_seh-1.dll libwinpthread-1.dll gcc.exe
          "--- go env"; go env CC CGO_ENABLED GOARCH
          $cc1 = (& $env:CC -print-prog-name=cc1); "cc1=$cc1"
          "--- cc1 --version"; & $cc1 --version; "cc1 exit=$LASTEXITCODE"
          Set-Content -Path t.c -Value 'int main(void){return 0;}'
          "--- gcc -v -c"; & $env:CC -v -c t.c -o t.o 2>&1; "gcc exit=$LASTEXITCODE"
          "--- go build runtime/cgo"; go build -a -x runtime/cgo 2>&1 | Select-Object -Last 30; "go build exit=$LASTEXITCODE"
          $env:PATH = "$msys2Loc\mingw64\bin;$env:PATH"
          "--- with mingw64\bin first: cc1 --version"; & $cc1 --version; "cc1 exit=$LASTEXITCODE"
          "--- with mingw64\bin first: gcc -c"; & $env:CC -c t.c -o t.o 2>&1; "gcc exit=$LASTEXITCODE"
          "--- with mingw64\bin first: where"; where.exe libz-1.dll zlib1.dll libgmp-10.dll
          exit 0

  after:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version-file: go.mod

      # ---- Per-OS webview build dependencies -------------------------------
      - name: Set up MSYS2 MinGW64 for Windows amd64 CGO
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        id: msys2-amd64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 https://github.com/msys2/setup-msys2/releases/tag/v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
      - name: Build web bundle (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: cd ui/web && npm ci && npm run build
      - name: Build webview exe (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MSYS2_LOC_AMD64: ${{ steps.msys2-amd64.outputs.msys2-location }}
          MSYS2_LOC_ARM64: ${{ steps.msys2-arm64.outputs.msys2-location }}
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "$env:MATRIX_ARCH"
          $env:CGO_ENABLED = "1"
          if ("$env:MATRIX_ARCH" -eq "amd64") {
            $msys2Loc = "$env:MSYS2_LOC_AMD64"
            $env:CC = "$msys2Loc\mingw64\bin\gcc.exe"
            $env:CXX = "$msys2Loc\mingw64\bin\g++.exe"
            # gcc spawns cc1 from lib\gcc\..., not bin\, so Windows resolves
            # cc1's DLL imports (libz-1.dll, libgmp-10.dll, ...) through PATH.
            # Without this, cc1 loads them from whichever other MinGW is first
            # on the runner PATH, or fails to start when that one lacks a DLL.
            $env:PATH = "$msys2Loc\mingw64\bin;$env:PATH"
          } else {
            $msys2Loc = "$env:MSYS2_LOC_ARM64"
            $env:CC = "$msys2Loc\clangarm64\bin\clang.exe"
            $env:CXX = "$msys2Loc\clangarm64\bin\clang++.exe"
          }
          & $env:CC --version
          # Vite builds into ui\web\dist (gitignored); copy it into the
          # //go:embed dist target so the exe embeds the real SPA, not the placeholder.
          # Every step is terminating: PowerShell continues past a failed
          # Copy-Item by default, which would embed the tracked placeholder in a
          # release exe and report success. Checking that the destination
          # index.html merely exists is not enough, because the placeholder is
          # already there -- so verify the copied bundle is not the placeholder.
          if (-not (Test-Path ui\web\dist\index.html)) {
            Write-Error "web bundle missing: ui\web\dist\index.html"; exit 1
          }
          Remove-Item -Recurse -Force ui\internal\webui\dist\* -ErrorAction Stop
          Copy-Item -Recurse -Force ui\web\dist\* ui\internal\webui\dist\ -ErrorAction Stop
          if (Select-String -Path ui\internal\webui\dist\index.html `
                -Pattern 'Pre-build placeholder' -Quiet) {
            Write-Error "embed dir still holds the placeholder after copy"; exit 1
          }
          # Mirror the Makefile's UI version ldflags: the tray update check
          # reads the embedded version, and only an exact tag is a release.
          $uiVersion = (& git describe --tags --exact-match 2>$null)
          $uiCommit = (& git rev-parse --short HEAD)
          $uiModule = "github.com/blinklabs-io/bursa/ui"
          $ldflags = "-s -w -H=windowsgui " +
            "-X '$uiModule/internal/version.Version=$uiVersion' " +
            "-X '$uiModule/internal/version.CommitHash=$uiCommit'"
          Push-Location ui
          go build -tags webview -ldflags $ldflags -o "$env:GITHUB_WORKSPACE\bursa-wallet.exe" ./cmd/bursa-wallet
          if ($LASTEXITCODE -ne 0) { Write-Error "webview exe build failed"; exit 1 }
          Pop-Location

name: ui

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: type-check
        run: npm run type-check
      - name: test
        run: npm run test
      - name: build
        run: npm run build

  extension:
    name: extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: type-check
        run: npm run type-check
      - name: test
        run: npm run test
      - name: build
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 https://github.com/actions/upload-artifact/releases/tag/v7.0.1
        with:
          name: bursa-connector-dist
          path: ui/extension/dist

  ui-go:
    name: ui-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
      # Build the web bundle first so the //go:embed dist target is populated
      # before the Go module is built/tested.
      - name: Build web bundle
        run: cd ui/web && npm ci && npm run build
      # Scope to the module's real Go roots (cmd + internal). A repo-wide "./..."
      # would descend into ui/web/node_modules, where the npm "flatted" package
      # vendors a stray *.go file; Go's "..." wildcard does not skip node_modules,
      # so on a clean checkout that package breaks module resolution
      # ("updates to go.mod needed"). The wallet's Go code lives only under
      # cmd/ and internal/.
      - name: go vet
        run: cd ui && go vet ./cmd/... ./internal/...
      - name: go test
        run: cd ui && go test ./cmd/... ./internal/...
      - name: go build
        run: cd ui && go build ./cmd/bursa-wallet

  # Compile the `-tags webview` desktop variant. Every other Go job builds only
  # the default pure-Go wallet, so nothing on a pull request ever exercised the
  # CGO webview path or the per-platform window_*.go / window_darwin.m sources.
  # Two breakages reached main that way — a duplicate Objective-C symbol on
  # macOS and webview_go's hardcoded webkit2gtk-4.0 dependency on Ubuntu 24.04 —
  # and were only caught by the release workflow. This builds the same variant
  # the release does, through the same Makefile target.
  #
  # Windows is intentionally absent: its webview build needs a bespoke MSYS2
  # toolchain and explicit CC/CXX wiring (see the publish workflow), which
  # remains that platform's guard.
  ui-webview:
    name: ui-webview (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: macos-15
            os: darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
      # Mirrors the release job's dependency set. Ubuntu 24.04 ships only
      # webkit2gtk-4.1; the Makefile's webkit-shim target bridges webview_go's
      # hardcoded 4.0 pkg-config request onto it.
      - name: Install Linux webview dependencies
        if: matrix.os == 'linux'
        run: |
          # Bound apt's per-connection network wait and enable retries so a
          # stalled mirror fails fast and retries instead of hanging the job for
          # hours (apt has no default fetch timeout here, which periodically left
          # this step stuck in `apt-get update` until the 6h max-runtime kill).
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99network-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      # The webview binary embeds the SPA, so the //go:embed dist target must be
      # populated before the Go build.
      - name: Build web bundle
        run: cd ui/web && npm ci && npm run build
      - name: Build webview binary
        run: make wallet-binary-webview

  ui-lint:
    name: ui-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
      # golangci-lint needs the embedded dist to type-check the webui package,
      # so build the web bundle before linting the nested module.
      - name: Build web bundle
        run: cd ui/web && npm ci && npm run build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0 https://github.com/golangci/golangci-lint-action/releases/tag/v9.3.0
        with:
          working-directory: ui
          # Scope to the module's real Go roots. A default "./..." load descends
          # into ui/web/node_modules, where the npm "flatted" package vendors a
          # stray *.go file; Go's "..." wildcard does not skip node_modules, so on
          # a clean checkout golangci-lint fails to load the package graph
          # ("no go files to analyze: running `go mod tidy` may solve the problem").
          args: ./cmd/... ./internal/...

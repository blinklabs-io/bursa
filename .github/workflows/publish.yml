name: publish

on:
  push:
    branches: ['main']
    tags:
      - 'v*.*.*'
  # A tag is the only trigger that exercises Developer ID signing and
  # notarization, so a defect there is only ever found during a release. This
  # input runs that same path on demand: it signs, notarizes and verifies the
  # .pkg, and uploads it as a workflow artifact without touching a release.
  workflow_dispatch:
    inputs:
      exercise_macos_signing:
        description: 'Build, sign, notarize and verify the macOS .pkg without cutting a tag'
        type: boolean
        default: false

concurrency: ${{ github.ref }}

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      RELEASE_ID: ${{ steps.create-release.outputs.result }}
    steps:
      # Every job here depends on this one, so this guard gates the workflow.
      #
      # Keeps a maintainer from dispatching this workflow from the wrong ref.
      #
      # This is a convenience guard, NOT a security control: a workflow_dispatch
      # run executes the workflow file from the dispatched ref, so anyone with
      # write access could push a branch with this step deleted and dispatch
      # that.
      #
      # A tag ref is rejected outright: a manual run there would take the
      # tag-only branches all the way through, creating a second draft release
      # with duplicate uploads and attestations.
      - name: Validate manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "::error::Do not dispatch this workflow against a tag; push the tag instead. A manual run on a tag would create a second draft release and re-upload its assets."
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "::error::This workflow may only be dispatched from ${DEFAULT_BRANCH}. Its macOS job holds the Apple signing and notarization credentials and runs the packaging scripts from the selected ref."
            exit 1
          fi
      - run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        id: create-release
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            try {
              const response = await github.rest.repos.createRelease({
                draft: true,
                generate_release_notes: true,
                name: process.env.RELEASE_TAG,
                owner: context.repo.owner,
                prerelease: process.env.RELEASE_PRERELEASE === 'true',
                repo: context.repo.repo,
                tag_name: process.env.RELEASE_TAG,
              });

              return response.data.id;
            } catch (error) {
              core.setFailed(error.message);
            }

  build-binaries:
    # A manual run exists to exercise the macOS packaging path. This job
    # publishes or finalises release output, so it stays on the push triggers.
    if: github.event_name != 'workflow_dispatch'
    # Windows verifies the CLI signatures natively; macOS notarizes its archive.
    name: build-binaries (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: darwin
            runner: macos-15
            targets: darwin/arm64
            arch: arm64
          - name: freebsd, linux
            runner: ubuntu-latest
            targets: freebsd/amd64 freebsd/arm64 linux/amd64 linux/arm64
          - name: windows
            runner: windows-latest
            targets: windows/amd64 windows/arm64
      max-parallel: 2
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    needs: [create-draft-release]
    permissions:
      actions: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      packages: write
      statuses: write
    env:
      TARGETS: ${{ matrix.targets }}
    steps:
      - run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 https://github.com/actions/setup-go/releases/tag/v7.1.0
        with:
          go-version-file: go.mod
      # Each target's binary is kept at build/<os>-<arch>/bursa. The make target
      # depends on the Go sources, not on GOOS/GOARCH, so the previous target's
      # output is removed first or make would skip the rebuild.
      - name: Build binaries
        run: |
          set -euo pipefail
          for _target in $TARGETS; do
            _os="${_target%/*}"
            _arch="${_target#*/}"
            if [[ "${_os}" == darwin && "${GITHUB_REF}" == refs/tags/* ]]; then continue; fi
            echo "::group::GOOS=${_os} GOARCH=${_arch}"
            rm -f bursa
            if [[ "${_os}" == windows ]]; then export CGO_ENABLED=0; fi
            GOOS="${_os}" GOARCH="${_arch}" make build
            mkdir -p "build/${_os}-${_arch}"
            _binary=bursa
            if [[ "${_os}" == windows ]]; then _binary=bursa.exe; fi
            mv bursa "build/${_os}-${_arch}/${_binary}"
            echo "::endgroup::"
          done

      # Sign Windows builds
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0 https://github.com/actions/setup-java/releases/tag/v6.3.0
        if: ${{ startsWith(github.ref, 'refs/tags/') && contains(matrix.targets, 'windows/') }}
        with:
          java-version: 17
          distribution: 'temurin'
      - id: 'auth'
        name: Authenticate with Google Cloud
        if: ${{ startsWith(github.ref, 'refs/tags/') && contains(matrix.targets, 'windows/') }}
        uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093' # v3.0.0 https://github.com/google-github-actions/auth/releases/tag/v3.0.0
        with:
          credentials_json: '${{ secrets.CERTIFICATE_SA_CREDENTIALS }}'
      - name: Set up Cloud SDK
        if: ${{ startsWith(github.ref, 'refs/tags/') && contains(matrix.targets, 'windows/') }}
        uses: 'google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db' # v3.0.1 https://github.com/google-github-actions/setup-gcloud/releases/tag/v3.0.1
      - name: Sign Windows CLI binaries
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        uses: blinklabs-io/shared-actions/sign-windows@f3ae0ebd71fbb78b8336fb7d8cc6b303e7c02707
        with:
          files: |
            build/windows-amd64/bursa.exe
            build/windows-arm64/bursa.exe
          application-name: Bursa
          store-type: ${{ secrets.CERTIFICATE_STORE_TYPE || 'GOOGLECLOUD' }}
          certificate-chain: ${{ secrets.CERTIFICATE_CHAIN }}
          keystore: ${{ secrets.CERTIFICATE_KEYSTORE }}
          key-name: ${{ secrets.CERTIFICATE_KEY_NAME }}

      - name: Load macOS CLI settings
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        id: macos-cli-config
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os
          with open('.github/governance/macos-cli.json', encoding='utf-8') as source:
              config = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('config=' + json.dumps(config, separators=(',', ':')) + '\n')
          PYCODE
      - name: Build signed macOS CLI archive
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        id: macos-cli
        uses: blinklabs-io/shared-actions/macos-release@a80f7002ed898be8536905f5a59002fce59890c4
        with:
          config: ${{ steps.macos-cli-config.outputs.config }}
          architecture: ${{ matrix.arch }}
          version: ${{ env.RELEASE_TAG }}
          mode: signed
          application-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          application-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CLI_PATH: ${{ steps.macos-cli.outputs.artifact }}
        run: |
          set -euo pipefail
          _assets=()
          for _target in $TARGETS; do
            _os="${_target%/*}"
            _arch="${_target#*/}"
            _dir="build/${_os}-${_arch}"
            _filename="bursa-${RELEASE_TAG}-${_os}-${_arch}"
            if [[ "${_os}" == "windows" ]]; then
              _filename="${_filename}.exe"
              cp "${_dir}/bursa.exe" "${_filename}"
            fi
            if [[ "${_os}" == "linux" || "${_os}" == "freebsd" ]]; then
              _filename="${_filename}.tar.gz"
              tar czf "${_filename}" -C "${_dir}" bursa
            fi
            _path="${_filename}"
            if [[ "${_os}" == "darwin" ]]; then
              _filename="${_filename}.zip"
              _path="${MACOS_CLI_PATH}"
              if [[ ! -f "${_path}" || "$(basename "${_path}")" != "${_filename}" ]]; then
                echo "::error::Signed macOS archive does not match the release asset name" >&2
                exit 1
              fi
            fi
            curl \
              --fail --show-error --silent \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${_path}" \
              "https://uploads.github.com/repos/${{ github.repository_owner }}/bursa/releases/${{ needs.create-draft-release.outputs.RELEASE_ID }}/assets?name=${_filename}"
            _assets+=("${_path}")
          done
          # Export the shipped asset paths so the attest step below targets the
          # ACTUAL uploaded artifacts (mirrors the wallet job's TARBALL_PATH
          # pattern); attesting the raw binaries would hash files we do not ship.
          _delimiter="ASSET_PATHS_EOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "ASSET_PATHS<<${_delimiter}"
            printf '%s\n' "${_assets[@]}"
            echo "${_delimiter}"
          } >> "$GITHUB_ENV"

      - name: Attest binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          # Attest the uploaded assets, not the raw binaries, so each attested
          # digest matches what `gh attestation verify` sees for the download.
          # ASSET_PATHS is exported by the upload step, which is tags-only, so
          # this step carries the same guard.
          subject-path: ${{ env.ASSET_PATHS }}

  # Build + package the Bursa desktop wallet (ui/cmd/bursa-wallet).
  #
  # The desktop app is the `-tags webview` variant (CGO + a system webview:
  # WKWebView on macOS, WebView2 on Windows, webkit2gtk on Linux) and CANNOT be
  # cross-compiled, so each installer is built on a NATIVE per-arch runner:
  #   * macOS  -> signed + notarized arm64 .pkg on macos-15
  #   * Windows-> signed .msi (build-msi.ps1) on windows-latest / windows-11-arm
  #   * Linux  -> a native webview binary (webkit2gtk), shipped as a tarball
  #   * FreeBSD-> the pure-Go headless cross-build (no system webview), tarball
  # Signing/notarization is env-gated: unsigned artifacts are produced on
  # non-tag pushes (validating the packaging path) and signed ones on tags.
  build-wallet-binaries:
    if: ${{ !cancelled() && needs.create-draft-release.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.build-binaries.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: ubuntu-latest
            os: freebsd
            arch: amd64
          - runner: ubuntu-latest
            os: freebsd
            arch: arm64
      max-parallel: 2
    runs-on: ${{ matrix.runner }}
    needs: [create-draft-release, build-binaries]
    permissions:
      actions: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      packages: write
      statuses: write
    steps:
      - name: Set RELEASE_TAG (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF -replace 'refs/tags/', ''
          echo "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set RELEASE_TAG
        if: matrix.os != 'windows'
        run: "echo \"RELEASE_TAG=${GITHUB_REF#refs/tags/}\" >> \"$GITHUB_ENV\""
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 https://github.com/actions/setup-node/releases/tag/v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 https://github.com/actions/setup-go/releases/tag/v7.1.0
        with:
          go-version-file: go.mod

      # ---- Per-OS webview build dependencies -------------------------------
      - name: Set up MSYS2 MinGW64 for Windows amd64 CGO
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        id: msys2-amd64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 https://github.com/msys2/setup-msys2/releases/tag/v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
      - name: Set up MSYS2 clangarm64 for Windows arm64 CGO
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        id: msys2-arm64
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 https://github.com/msys2/setup-msys2/releases/tag/v2.33.0
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            mingw-w64-clang-aarch64-clang
      - name: Install Linux webview dependencies
        if: matrix.os == 'linux'
        run: |
          # Bound apt's per-connection network wait and enable retries so a
          # stalled mirror fails fast and retries instead of hanging the job for
          # hours (apt has no default fetch timeout here, which periodically left
          # this step stuck in `apt-get update` until the 6h max-runtime kill).
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99network-timeouts >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Load macOS wallet settings
        if: matrix.os == 'darwin'
        id: macos-wallet-config
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os
          with open('.github/governance/macos-wallet.json', encoding='utf-8') as source:
              config = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('config=' + json.dumps(config, separators=(',', ':')) + '\n')
          PYCODE
      - name: Build macOS package
        if: matrix.os == 'darwin'
        id: macos-package
        uses: blinklabs-io/shared-actions/macos-release@a80f7002ed898be8536905f5a59002fce59890c4
        with:
          config: ${{ steps.macos-wallet-config.outputs.config }}
          architecture: ${{ matrix.arch }}
          version: ${{ startsWith(github.ref, 'refs/tags/') && env.RELEASE_TAG || '' }}
          mode: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.exercise_macos_signing) && 'signed' || 'unsigned' }}
          application-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          application-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          installer-certificate: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          installer-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      # A manual exercise run publishes nothing to a release, so surface the
      # verified pkg as a workflow artifact for inspection.
      - name: Upload exercised macOS .pkg
        if: matrix.os == 'darwin' && github.event_name == 'workflow_dispatch' && inputs.exercise_macos_signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        with:
          name: bursa-wallet-macos-pkg-${{ matrix.arch }}
          path: ${{ steps.macos-package.outputs.artifact }}
          if-no-files-found: error

      # ---- Windows: build the webview .exe (validates the CGO build) -------
      - name: Build web bundle (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: cd ui/web && npm ci && npm run build
      - name: Build webview exe (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MSYS2_LOC_AMD64: ${{ steps.msys2-amd64.outputs.msys2-location }}
          MSYS2_LOC_ARM64: ${{ steps.msys2-arm64.outputs.msys2-location }}
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "$env:MATRIX_ARCH"
          $env:CGO_ENABLED = "1"
          if ("$env:MATRIX_ARCH" -eq "amd64") {
            $msys2Loc = "$env:MSYS2_LOC_AMD64"
            $env:CC = "$msys2Loc\mingw64\bin\gcc.exe"
            $env:CXX = "$msys2Loc\mingw64\bin\g++.exe"
            # gcc spawns cc1 from lib\gcc\..., not bin\, so Windows resolves
            # cc1's DLL imports (libz-1.dll, libgmp-10.dll, ...) through PATH.
            # Without this, cc1 loads them from whichever other MinGW is first
            # on the runner PATH, or fails to start when that one lacks a DLL.
            $env:PATH = "$msys2Loc\mingw64\bin;$env:PATH"
          } else {
            $msys2Loc = "$env:MSYS2_LOC_ARM64"
            $env:CC = "$msys2Loc\clangarm64\bin\clang.exe"
            $env:CXX = "$msys2Loc\clangarm64\bin\clang++.exe"
          }
          & $env:CC --version
          # Vite builds into ui\web\dist (gitignored); copy it into the
          # //go:embed dist target so the exe embeds the real SPA, not the placeholder.
          # Every step is terminating: PowerShell continues past a failed
          # Copy-Item by default, which would embed the tracked placeholder in a
          # release exe and report success. Checking that the destination
          # index.html merely exists is not enough, because the placeholder is
          # already there -- so verify the copied bundle is not the placeholder.
          if (-not (Test-Path ui\web\dist\index.html)) {
            Write-Error "web bundle missing: ui\web\dist\index.html"; exit 1
          }
          Remove-Item -Recurse -Force ui\internal\webui\dist\* -ErrorAction Stop
          Copy-Item -Recurse -Force ui\web\dist\* ui\internal\webui\dist\ -ErrorAction Stop
          if (Select-String -Path ui\internal\webui\dist\index.html `
                -Pattern 'Pre-build placeholder' -Quiet) {
            Write-Error "embed dir still holds the placeholder after copy"; exit 1
          }
          # Mirror the Makefile's UI version ldflags: the tray update check
          # reads the embedded version, and only an exact tag is a release.
          $uiVersion = (& git describe --tags --exact-match 2>$null)
          $uiCommit = (& git rev-parse --short HEAD)
          $uiModule = "github.com/blinklabs-io/bursa/ui"
          $ldflags = "-s -w -H=windowsgui " +
            "-X '$uiModule/internal/version.Version=$uiVersion' " +
            "-X '$uiModule/internal/version.CommitHash=$uiCommit'"
          Push-Location ui
          go build -tags webview -ldflags $ldflags -o "$env:GITHUB_WORKSPACE\bursa-wallet.exe" ./cmd/bursa-wallet
          if ($LASTEXITCODE -ne 0) { Write-Error "webview exe build failed"; exit 1 }
          Pop-Location

      # ---- Windows signing (tags only): sign the .exe BEFORE the MSI wraps it
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0 https://github.com/actions/setup-java/releases/tag/v6.3.0
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' }}
        with:
          java-version: 21
          distribution: 'temurin'
      - id: 'auth'
        name: Authenticate with Google Cloud
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0 https://github.com/google-github-actions/auth/releases/tag/v3.0.0
        with:
          credentials_json: '${{ secrets.CERTIFICATE_SA_CREDENTIALS }}'
      - name: Set up Cloud SDK
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1 https://github.com/google-github-actions/setup-gcloud/releases/tag/v3.0.1
      - name: Sign Windows wallet binary
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows'
        uses: blinklabs-io/shared-actions/sign-windows@f3ae0ebd71fbb78b8336fb7d8cc6b303e7c02707
        with:
          files: bursa-wallet.exe
          application-name: Bursa
          store-type: ${{ secrets.CERTIFICATE_STORE_TYPE || 'GOOGLECLOUD' }}
          certificate-chain: ${{ secrets.CERTIFICATE_CHAIN }}
          keystore: ${{ secrets.CERTIFICATE_KEYSTORE }}
          key-name: ${{ secrets.CERTIFICATE_KEY_NAME }}

      - name: Install WiX toolset (Windows)
        # Install WiX on every push so the MSI build (below) runs on non-tag
        # pushes too, catching packaging regressions before a release.
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" --version
      - name: Build MSI (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          BURSA_EXE: ${{ github.workspace }}\bursa-wallet.exe
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && env.RELEASE_TAG || '' }}
        run: |
          pwsh ./packaging/windows/build-msi.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:VERSION) {
            $version = $env:VERSION -replace '^v', ''
            "MSI_PATH=dist/bursa-wallet-$version-windows-$($env:ARCH).msi" >> $env:GITHUB_ENV
          }
      - name: Sign Windows wallet MSI
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows'
        uses: blinklabs-io/shared-actions/sign-windows@f3ae0ebd71fbb78b8336fb7d8cc6b303e7c02707
        with:
          files: ${{ env.MSI_PATH }}
          application-name: Bursa
          store-type: ${{ secrets.CERTIFICATE_STORE_TYPE || 'GOOGLECLOUD' }}
          certificate-chain: ${{ secrets.CERTIFICATE_CHAIN }}
          keystore: ${{ secrets.CERTIFICATE_KEYSTORE }}
          key-name: ${{ secrets.CERTIFICATE_KEY_NAME }}

      - name: Verify MSI signature (Windows)
        if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows' }}
        shell: pwsh
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          if (-not (Test-Path $sdkRoot)) { Write-Error "Windows SDK not found at $sdkRoot"; exit 1 }
          $archDir = if ("$env:MATRIX_ARCH" -eq "arm64") { "arm64" } else { "x64" }
          $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe `
            | Where-Object { $_.FullName -match "\\$archDir\\signtool\.exe$" } `
            | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) {
            $signtool = Get-ChildItem -Path $sdkRoot -Recurse -Filter signtool.exe `
              | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $signtool) { Write-Error "signtool.exe not found under $sdkRoot"; exit 1 }
          $msi = $env:MSI_PATH
          if (-not (Test-Path $msi)) { Write-Error "MSI not found at $msi"; exit 1 }
          & $signtool.FullName verify /pa /v $msi
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify failed for $msi"; exit 1 }
          Write-Host "MSI signature verified: $msi"

      # ---- Linux: native webview binary; FreeBSD: headless cross-build -----
      - name: Build Linux webview binary
        if: matrix.os == 'linux'
        env:
          GOARCH: ${{ matrix.arch }}
        run: make wallet-webview
      - name: Build FreeBSD headless binary
        if: matrix.os == 'freebsd'
        env:
          CGO_ENABLED: '0'
          GOOS: freebsd
          GOARCH: ${{ matrix.arch }}
        run: make wallet

      # ---- Uploads (tags only) ---------------------------------------------
      - name: Upload release asset (macOS pkg)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'darwin'
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_PACKAGE_PATH: ${{ steps.macos-package.outputs.artifact }}
        run: |
          set -euo pipefail
          _version="${RELEASE_TAG#v}"
          _filename="bursa-wallet-${_version}-${MATRIX_OS}-${MATRIX_ARCH}.pkg"
          _path="${MACOS_PACKAGE_PATH}"
          if [[ ! -f "${_path}" || "$(basename "${_path}")" != "${_filename}" ]]; then
            echo "::error::Verified macOS package does not match the release asset name" >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${_path}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${_filename}"
      - name: Upload release asset (Windows MSI)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows'
        shell: pwsh
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msiPath = $env:MSI_PATH
          $assetName = Split-Path -Leaf $msiPath
          if (-not (Test-Path -LiteralPath $msiPath)) { throw "MSI not found at $msiPath" }
          $headers = @{
            "Authorization" = "token $env:GH_TOKEN"
            "Content-Type" = "application/octet-stream"
          }
          $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$assetName"
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers $headers -InFile $msiPath
      - name: Upload release asset (Linux/FreeBSD binary)
        if: startsWith(github.ref, 'refs/tags/') && (matrix.os == 'linux' || matrix.os == 'freebsd')
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_ARCH: ${{ matrix.arch }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.RELEASE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Strip the leading "v" so the tarball name matches the macOS .pkg /
          # Windows .msi asset naming convention (bursa-wallet-<x.y.z>-...).
          _version="${RELEASE_TAG#v}"
          _filename="bursa-wallet-${_version}-${MATRIX_OS}-${MATRIX_ARCH}.tar.gz"
          cp ui/bursa-wallet bursa-wallet
          tar czf "${_filename}" bursa-wallet
          # Export the shipped tarball path so the attest step below can target
          # the ACTUAL uploaded artifact (mirrors the Windows MSI_PATH pattern);
          # attesting the raw binary would hash a file we do not ship.
          echo "TARBALL_PATH=${_filename}" >> "$GITHUB_ENV"
          curl --fail --show-error --silent \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"${_filename}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${_filename}"

      # ---- Attestations (tags only) ----------------------------------------
      - name: Attest pkg (macOS)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'darwin'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: ${{ steps.macos-package.outputs.artifact }}
      - name: Attest MSI (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-path: ${{ env.MSI_PATH }}
      - name: Attest binary (Linux/FreeBSD)
        if: startsWith(github.ref, 'refs/tags/') && (matrix.os == 'linux' || matrix.os == 'freebsd')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          # Attest the shipped .tar.gz (exported by the upload step), not the raw
          # binary, so the attested hash matches the released artifact.
          subject-path: ${{ env.TARBALL_PATH }}

  build-images:
    # A manual run exists to exercise the macOS packaging path. This job
    # publishes or finalises release output, so it stays on the push triggers.
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
      max-parallel: 2
    runs-on: ${{ matrix.os }}
    needs: [create-draft-release, build-wallet-binaries]
    permissions:
      actions: write
      attestations: write
      checks: write
      contents: write
      id-token: write
      packages: write
      statuses: write
    steps:
      - run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 https://github.com/docker/login-action/releases/tag/v4.8.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 https://github.com/docker/login-action/releases/tag/v4.8.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/bursa
            ghcr.io/${{ github.repository }}
          flavor: |
            # The matrix publishes one image per architecture. A floating tag
            # here would be pushed by both jobs and race, leaving `latest`
            # pointing at whichever architecture finished last; the manifest
            # job creates it from the composed manifest instead.
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Build images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 https://github.com/docker/build-push-action/releases/tag/v7.4.0
        id: push
        with:
          outputs: "type=registry,push=true"
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest Docker Hub image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: index.docker.io/blinklabs/bursa
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest GHCR image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-image-manifest:
    # A manual run exists to exercise the macOS packaging path. This job
    # publishes or finalises release output, so it stays on the push triggers.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 https://github.com/docker/login-action/releases/tag/v4.8.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }} # uses token
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 https://github.com/docker/login-action/releases/tag/v4.8.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 https://github.com/docker/metadata-action/releases/tag/v6.2.0
        with:
          images: |
            blinklabs/bursa
            ghcr.io/${{ github.repository }}
          tags: |
            # branch
            type=ref,event=branch
            # semver
            type=semver,pattern={{version}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1
      - name: Create and push image manifests
        id: manifest
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          PRIMARY_VERSION: ${{ steps.meta.outputs.version }}
        run: bash .github/scripts/publish-image-manifests.sh
      - name: Attest Docker Hub manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: index.docker.io/blinklabs/bursa
          subject-digest: ${{ steps.manifest.outputs.dockerhub-digest }}
          push-to-registry: true
      - name: Attest GHCR manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 https://github.com/actions/attest/releases/tag/v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.ghcr-digest }}
          push-to-registry: true
      # Update Docker Hub from README
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0 https://github.com/peter-evans/dockerhub-description/releases/tag/v5.0.0
        with:
          username: blinklabs
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: blinklabs/bursa
          readme-filepath: ./README.md
          short-description: "Bursa is a programmatic Cardano wallet and CLI tool"

  finalize-release:
    # A manual run exists to exercise the macOS packaging path. This job
    # publishes or finalises release output, so it stays on the push triggers.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [create-draft-release, build-binaries, build-wallet-binaries, build-images, build-image-manifest]
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 https://github.com/actions/github-script/releases/tag/v9.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-draft-release.outputs.RELEASE_ID }},
                draft: false,
              });
            } catch (error) {
              core.setFailed(error.message);
            }
      # This updates the documentation on pkg.go.dev and the latest version available via the Go module proxy
      - name: Pull new module version
        if: startsWith(github.ref, 'refs/tags/')
        uses: andrewslotin/go-proxy-pull-action@00af8a5a49c844d6dde0bbbc116b72d8fd7ae97c # v1.5.0 https://github.com/andrewslotin/go-proxy-pull-action/releases/tag/v1.5.0

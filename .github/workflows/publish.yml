name: Native Windows CLI smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      TARGETS: windows/amd64 windows/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Build both CLI targets using the proposed release step
        shell: bash
        run: |
          set -euo pipefail
          for _target in $TARGETS; do
            _os="${_target%/*}"
            _arch="${_target#*/}"
            echo "::group::GOOS=${_os} GOARCH=${_arch}"
            rm -f bursa
            if [[ "${_os}" == windows ]]; then export CGO_ENABLED=0; fi
            GOOS="${_os}" GOARCH="${_arch}" make build
            mkdir -p "build/${_os}-${_arch}"
            _binary=bursa
            if [[ "${_os}" == windows ]]; then _binary=bursa.exe; fi
            mv bursa "build/${_os}-${_arch}/${_binary}"
            echo "::endgroup::"
          done
      - name: Verify PE architecture and signing preconditions
        shell: pwsh
        run: |
          foreach ($arch in 'amd64','arm64') {
            $path = "build/windows-$arch/bursa.exe"
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $path))
            $header = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $header + 4)
            $expected = if ($arch -eq 'amd64') { 0x8664 } else { 0xaa64 }
            if ($machine -ne $expected) { throw "Wrong PE machine for $path" }
            if ((Get-AuthenticodeSignature -LiteralPath $path).Status -ne 'NotSigned') { throw "Expected unsigned $path" }
            Write-Host "Verified $arch CLI input at $path"
          }

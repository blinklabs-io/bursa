name: openapi

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # go-test.yml builds and tests the openapi module but never regenerates it,
  # so a Swagger change that skips openapi.sh would leave a stale client.
  drift:
    name: openapi (drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 https://github.com/actions/setup-go/releases/tag/v7.1.0
        with:
          go-version-file: go.mod
      - name: regenerate client
        run: ./openapi.sh
      - name: fail on generated diff
        run: |
          git status --short
          git --no-pager diff
          test -z "$(git status --porcelain)"

name: openapi

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # go-test.yml builds and tests the openapi module but never regenerates it,
  # so a Swagger change that skips openapi.sh would leave a stale client.
  drift:
    name: openapi (drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 https://github.com/actions/setup-go/releases/tag/v7.0.0
        with:
          go-version: 1.26.x
      - name: regenerate client
        run: ./openapi.sh
      - name: fail on generated diff
        run: |
          git status --short
          git --no-pager diff
          test -z "$(git status --porcelain)"

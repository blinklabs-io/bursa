openapi: 3.0.1
info:
  contact:
    email: support@blinklabs.io
    name: Blink Labs
    url: https://blinklabs.io
  description: Programmable Cardano Wallet API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: bursa
  version: v0
servers:
- url: /
paths:
  /api/address/build:
    post:
      description: Builds a Cardano address from verification keys
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.AddressBuildRequest"
        description: Address Build Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.AddressBuildResponse"
          description: Address built successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request or keys
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal server error
      summary: Build Cardano address
      x-codegen-request-body-name: request
  /api/address/enumerate:
    post:
      description: Derives consecutive base addresses from a mnemonic for the given
        account and network
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.AddressEnumerateRequest"
        description: Address Enumerate Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/bursa.EnumeratedAddress"
                type: array
          description: Enumerated addresses
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request
      security:
      - BearerAuth: []
      summary: Enumerate derived addresses for a wallet
      x-codegen-request-body-name: request
  /api/address/parse:
    post:
      description: Parses a Cardano address and returns its components and metadata
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.AddressParseRequest"
        description: Address Parse Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.AddressParseResponse"
          description: Address parsed successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request or address
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal server error
      summary: Parse Cardano address
      x-codegen-request-body-name: request
  /api/script/address:
    post:
      description: Generate an address for a script on the specified network
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.ScriptAddressRequest"
        description: Script Address Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ScriptAddressResponse"
          description: Script address generated
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal server error
      summary: Generate script address
      x-codegen-request-body-name: request
  /api/script/create:
    post:
      description: Create a new multi-signature script with the specified parameters
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.ScriptCreateRequest"
        description: Script Create Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ScriptResponse"
          description: Script successfully created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal server error
      summary: Create a multi-signature script
      x-codegen-request-body-name: request
  /api/script/validate:
    post:
      description: Validate a script's structure and requirements
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.ScriptValidateRequest"
        description: Script Validate Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ScriptValidateResponse"
          description: Script validation result
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal server error
      summary: Validate a script
      x-codegen-request-body-name: request
  /api/sign/data:
    post:
      description: "Sign a payload using a signing key, producing a COSE_Sign1 structure"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.SignDataRequest"
        description: Sign Data Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.SignDataResponse"
          description: COSE_Sign1 signature and COSE_Key
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Sign a message (CIP-8/CIP-30 signData)
      x-codegen-request-body-name: request
  /api/sign/verify:
    post:
      description: Verify a COSE_Sign1 signature against a COSE_Key and expected payload
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.VerifyDataRequest"
        description: Verify Data Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.VerifyDataResponse"
          description: Verification result
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Bad Request
      summary: Verify a CIP-8/CIP-30 signData signature
      x-codegen-request-body-name: request
  /api/tx/assemble:
    post:
      description: Merge detached witnesses into a transaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.TxAssembleRequest"
        description: Transaction + witnesses
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.TxCborResponse"
          description: Assembled signed transaction
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal Server Error
      summary: Assemble a signed transaction
      x-codegen-request-body-name: request
  /api/tx/decode:
    post:
      description: Decode and inspect a transaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.TxDecodeRequest"
        description: Transaction
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/bursa.TxInspection"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Bad Request
      summary: Decode a transaction
      x-codegen-request-body-name: request
  /api/tx/id:
    post:
      description: Calculate the transaction id from a transaction body
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.TxIDRequest"
        description: Transaction
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.TxIDResponse"
          description: Transaction id
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Bad Request
      summary: Get a transaction id
      x-codegen-request-body-name: request
  /api/tx/sign:
    post:
      description: Add vkey witnesses for the provided signing keys (body preserved)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.TxSignRequest"
        description: Transaction + signing keys
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.TxCborResponse"
          description: Signed transaction
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Sign a transaction
      x-codegen-request-body-name: request
  /api/tx/witness:
    post:
      description: Produce a detached vkey witness for a transaction body
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.TxWitnessRequest"
        description: Transaction + signing key
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.TxWitnessResponse"
          description: Detached witness
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Produce a transaction witness
      x-codegen-request-body-name: request
  /api/wallet/create:
    post:
      description: Create a wallet and return details
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/bursa.Wallet"
          description: Ok
      security:
      - BearerAuth: []
      summary: Create a wallet
  /api/wallet/delete:
    post:
      description: Deletes a wallet from persistent storage and optional password.
        Requires an authenticated wallet storage administrator.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.WalletDeleteRequest"
        description: Wallet Delete Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Wallet successfully deleted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Wallet storage administrator access required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Delete wallet from persistent storage
      x-codegen-request-body-name: request
  /api/wallet/get:
    post:
      description: Gets a wallet from persistent storage and optional password and
        returns wallet details. Requires an authenticated wallet storage administrator.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.WalletGetRequest"
        description: Wallet Restore Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/bursa.Wallet"
          description: Wallet successfully loaded
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Wallet storage administrator access required
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Get wallet from persistent storage
      x-codegen-request-body-name: request
  /api/wallet/list:
    get:
      description: List all wallets stored in secret storage matching our prefix.
        Requires an authenticated wallet storage administrator.
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: Ok
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Wallet storage administrator access required
      security:
      - BearerAuth: []
      summary: Lists wallets
  /api/wallet/restore:
    post:
      description: Restores a wallet using the provided mnemonic seed phrase and optional
        password and returns wallet details.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.WalletRestoreRequest"
        description: Wallet Restore Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/bursa.Wallet"
          description: Wallet successfully restored
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Invalid request
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Restore a wallet using a mnemonic seed phrase
      x-codegen-request-body-name: request
  /api/wallet/update:
    post:
      description: Updates a wallet from persistent storage and optional password
        and returns wallet details. Requires an authenticated wallet storage administrator.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/api.WalletUpdateRequest"
        description: Wallet Update Request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: Wallet successfully updated
        "400":
          content:
            application/json:
              schema:
                type: string
          description: Invalid request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api.ErrorResponse"
          description: Wallet storage administrator access required
        "500":
          content:
            application/json:
              schema:
                type: string
          description: Internal server error
      security:
      - BearerAuth: []
      summary: Update a wallet in persistent storage
      x-codegen-request-body-name: request
components:
  schemas:
    api.AddressBuildRequest:
      properties:
        network:
          enum:
          - mainnet
          - testnet
          type: string
        paymentKey:
          description: bech32-encoded verification key (required for base and enterprise
            address types)
          type: string
        stakeKey:
          description: bech32-encoded verification key (required for base and reward
            address types)
          type: string
        type:
          description: "defaults to \"base\" - determines which keys are required:\
            \ base requires both paymentKey and stakeKey, enterprise requires paymentKey\
            \ only, reward requires stakeKey only"
          enum:
          - base
          - enterprise
          - reward
          type: string
      required:
      - network
      type: object
    api.AddressBuildResponse:
      example:
        address: address
        type: type
        network: network
      properties:
        address:
          type: string
        network:
          type: string
        type:
          type: string
      type: object
    api.AddressEnumerateRequest:
      properties:
        account:
          maximum: 2147483647
          type: integer
        count:
          maximum: 1000
          minimum: 1
          type: integer
        mnemonic:
          type: string
        network:
          enum:
          - mainnet
          - preprod
          - preview
          type: string
        password:
          type: string
        start:
          maximum: 2147483647
          type: integer
      required:
      - count
      - mnemonic
      - network
      type: object
    api.AddressParseRequest:
      properties:
        address:
          type: string
      required:
      - address
      type: object
    api.AddressParseResponse:
      example:
        stake:
          hex: hex
          type: type
          bech32: bech32
        pointer:
          certIndex: 0
          slot: 6
          txIndex: 1
        address: address
        byron:
          type: type
        payment:
          hex: hex
          type: type
          bech32: bech32
        typeDescription: typeDescription
        type: type
        network: network
      properties:
        address:
          type: string
        byron:
          $ref: "#/components/schemas/api.ByronAddressInfo"
        network:
          type: string
        payment:
          $ref: "#/components/schemas/api.CredentialInfo"
        pointer:
          $ref: "#/components/schemas/api.PointerInfo"
        stake:
          $ref: "#/components/schemas/api.CredentialInfo"
        type:
          type: string
        typeDescription:
          type: string
      type: object
    api.ByronAddressInfo:
      example:
        type: type
      properties:
        type:
          description: "\"pubkey\", \"script\", or \"redeem\""
          type: string
      type: object
    api.CredentialInfo:
      example:
        hex: hex
        type: type
        bech32: bech32
      properties:
        bech32:
          description: bech32-encoded credential
          type: string
        hex:
          description: hex-encoded credential
          type: string
        type:
          description: '"key" or "script"'
          type: string
      type: object
    api.ErrorResponse:
      example:
        error: error
        fields:
          key: fields
      properties:
        error:
          type: string
        fields:
          additionalProperties:
            type: string
          type: object
      type: object
    api.PointerInfo:
      example:
        certIndex: 0
        slot: 6
        txIndex: 1
      properties:
        certIndex:
          type: integer
        slot:
          format: int64
          type: integer
        txIndex:
          type: integer
      type: object
    api.ScriptAddressRequest:
      properties:
        network:
          enum:
          - mainnet
          - testnet
          type: string
        script:
          additionalProperties:
            type: object
          type: object
      required:
      - network
      - script
      type: object
    api.ScriptAddressResponse:
      example:
        address: address
        scriptHash: scriptHash
        network: network
      properties:
        address:
          type: string
        network:
          type: string
        scriptHash:
          type: string
      type: object
    api.ScriptCreateRequest:
      properties:
        key_hashes:
          items:
            type: string
          minItems: 1
          type: array
        network:
          enum:
          - mainnet
          - testnet
          type: string
        required:
          minimum: 1
          type: integer
        timelock_after:
          format: int64
          type: integer
        timelock_before:
          format: int64
          type: integer
        type:
          enum:
          - nOf
          - all
          - any
          type: string
      required:
      - key_hashes
      - network
      - type
      type: object
    api.ScriptResponse:
      example:
        address: address
        scriptHash: scriptHash
        type: type
        script:
          key: "{}"
      properties:
        address:
          type: string
        script:
          additionalProperties:
            type: object
          type: object
        scriptHash:
          type: string
        type:
          type: string
      type: object
    api.ScriptValidateRequest:
      properties:
        message:
          description: Hex-encoded signed payload
          format: hex
          type: string
        public_keys:
          items:
            format: hex
            maxLength: 64
            minLength: 64
            type: string
          type: array
        require_signatures:
          type: boolean
        script:
          additionalProperties:
            type: object
          type: object
        signatures:
          items:
            type: string
          type: array
        slot:
          format: int64
          type: integer
      required:
      - script
      type: object
    api.ScriptValidateResponse:
      example:
        valid: true
        scriptHash: scriptHash
        slot: 6
        signatures: 0
      properties:
        scriptHash:
          type: string
        signatures:
          type: integer
        slot:
          format: int64
          type: integer
        valid:
          type: boolean
      type: object
    api.SignDataRequest:
      properties:
        address:
          type: string
        payload:
          type: string
        signing_key:
          type: string
      required:
      - address
      - payload
      - signing_key
      type: object
    api.SignDataResponse:
      example:
        signature: signature
        key: key
      properties:
        key:
          type: string
        signature:
          type: string
      type: object
    api.TxAssembleRequest:
      properties:
        tx_cbor:
          description: raw hex CBOR or JSON text envelope
          type: string
        witnesses:
          items:
            type: string
          minItems: 1
          type: array
      required:
      - tx_cbor
      - witnesses
      type: object
    api.TxCborResponse:
      example:
        tx_cbor: tx_cbor
        tx_id: tx_id
      properties:
        tx_cbor:
          type: string
        tx_id:
          type: string
      type: object
    api.TxDecodeRequest:
      properties:
        tx_cbor:
          description: raw hex CBOR or JSON text envelope
          type: string
      required:
      - tx_cbor
      type: object
    api.TxIDRequest:
      properties:
        tx_cbor:
          description: raw hex CBOR or JSON text envelope
          type: string
      required:
      - tx_cbor
      type: object
    api.TxIDResponse:
      example:
        tx_id: tx_id
      properties:
        tx_id:
          type: string
      type: object
    api.TxSignRequest:
      properties:
        signing_keys:
          items:
            type: string
          minItems: 1
          type: array
        tx_cbor:
          description: raw hex CBOR or JSON text envelope
          type: string
      required:
      - signing_keys
      - tx_cbor
      type: object
    api.TxWitnessRequest:
      properties:
        signing_key:
          type: string
        tx_cbor:
          description: raw hex CBOR or JSON text envelope
          type: string
      required:
      - signing_key
      - tx_cbor
      type: object
    api.TxWitnessResponse:
      example:
        witness: witness
      properties:
        witness:
          type: string
      type: object
    api.VerifyDataRequest:
      properties:
        key:
          type: string
        payload:
          type: string
        signature:
          type: string
      required:
      - key
      - payload
      - signature
      type: object
    api.VerifyDataResponse:
      example:
        valid: true
      properties:
        valid:
          type: boolean
      type: object
    api.WalletDeleteRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        password:
          type: string
      required:
      - name
      type: object
    api.WalletGetRequest:
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
        password:
          type: string
      required:
      - name
      type: object
    api.WalletRestoreRequest:
      properties:
        account_id:
          maximum: 2147483647
          type: integer
        address_id:
          maximum: 2147483647
          type: integer
        committee_cold_id:
          maximum: 2147483647
          type: integer
        committee_hot_id:
          maximum: 2147483647
          type: integer
        drep_id:
          maximum: 2147483647
          type: integer
        mnemonic:
          minLength: 1
